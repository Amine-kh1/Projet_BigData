name: saas-bigdata-batch

x-spark-common: &spark-common
  build: .
  image: saas-bigdata-spark:3.5.3
  init: true
  working_dir: /workspace
  volumes:
    - .:/workspace
  environment: &spark-env
    SPARK_MASTER_URL: spark://spark-master:7077
    SPARK_DRIVER_HOST: jupyter
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-miniouser}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret123}
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-miniouser}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret123}
    AWS_DEFAULT_REGION: us-east-1
    PYSPARK_PYTHON: python3
    PYSPARK_DRIVER_PYTHON: python3
    PYTHONPATH: /opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip:/workspace:/workspace/scripts
    SPARK_EVENTLOG_DIR: /workspace/evidence/spark-events
    SPARK_DAEMON_MEMORY: 512m
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  # The official Kafka process runs as uid1000; initialize volume ownership once.
  kafka-volume-init:
    image: apache/kafka:3.7.2
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command: ["chown 1000:1000 /tmp/kraft-combined-logs && chmod 0750 /tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: "no"

  kafka:
    image: apache/kafka:3.7.2
    hostname: kafka
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.7.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic orders
    restart: "no"

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    image: saas-bigdata-minio:2025-04
    hostname: minio
    command: [server, /data, --console-address, ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-miniouser}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret123}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: saas-bigdata-minio:2025-04
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-miniouser}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret123}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: [/bin/sh, /scripts/init-storage.sh]
    restart: "no"

  # Utility service: docker compose run --rm mc ls --recursive local/lake/
  mc:
    image: saas-bigdata-minio:2025-04
    entrypoint: [mc]
    profiles: [tools]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-miniouser}:${MINIO_ROOT_PASSWORD:-miniosecret123}@minio:9000
    volumes:
      - .:/workspace
    working_dir: /workspace

  # Run after generating data: docker compose run --rm init-data
  init-data:
    image: saas-bigdata-minio:2025-04
    profiles: [tools]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-miniouser}:${MINIO_ROOT_PASSWORD:-miniosecret123}@minio:9000
    volumes:
      - .:/workspace:ro
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        test -s /workspace/data/orders_history.jsonl
        test -s /workspace/data/restaurants.json
        mc cp /workspace/data/orders_history.jsonl local/lake/bronze/history/orders_history.jsonl
        mc cp /workspace/data/restaurants.json local/lake/reference/restaurants.json
        mc ls --recursive local/lake/

  spark-master:
    <<: *spark-common
    hostname: spark-master
    command: [/opt/spark/bin/spark-class, org.apache.spark.deploy.master.Master, --host, spark-master, --port, "7077", --webui-port, "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/json/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  spark-worker-1:
    <<: *spark-common
    hostname: spark-worker-1
    depends_on:
      spark-master:
        condition: service_healthy
    command: [/opt/spark/bin/spark-class, org.apache.spark.deploy.worker.Worker, --host, spark-worker-1, --cores, "2", --memory, 2g, --webui-port, "8081", spark://spark-master:7077]
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/json/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  spark-worker-2:
    <<: *spark-common
    hostname: spark-worker-2
    depends_on:
      spark-master:
        condition: service_healthy
    command: [/opt/spark/bin/spark-class, org.apache.spark.deploy.worker.Worker, --host, spark-worker-2, --cores, "2", --memory, 2g, --webui-port, "8081", spark://spark-master:7077]
    ports:
      - "127.0.0.1:18082:8081"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/json/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  jupyter:
    <<: *spark-common
    hostname: jupyter
    environment:
      <<: *spark-env
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-bigdata-local-2026}
    depends_on:
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    command: [bash, -lc, "mkdir -p /workspace/evidence/spark-events && exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.root_dir=/workspace"]
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8888/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  spark-history:
    <<: *spark-common
    hostname: spark-history
    environment:
      <<: *spark-env
      SPARK_HISTORY_OPTS: -Dspark.history.fs.logDirectory=file:///workspace/evidence/spark-events -Dspark.history.ui.port=18080 -Dspark.history.fs.update.interval=5s
    command: [bash, -lc, "mkdir -p /workspace/evidence/spark-events && exec /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer"]
    ports:
      - "127.0.0.1:18081:18080"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:18080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  kafka-data:
  minio-data:
